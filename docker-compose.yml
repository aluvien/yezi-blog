services:
  yezi-blog:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://yezi.me}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: yezi-blog
    ports:
      # 只允许本机 Nginx/反向代理访问，防止绕过 HTTPS 与真实 IP 边界。
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      BLOG_ROOT: /app
      BLOG_DB_PATH: /app/data/blog.db
    volumes:
      # 数据库、上传、引用归档与本地服务状态全部在同一个卷里。
      - blog-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  blog-data:
